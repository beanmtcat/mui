services:
  mui-service:
    container_name: mui-service
    build:
      context: ..
      dockerfile: deploy/Mui.Dockerfile
    restart: unless-stopped
    environment:
      MUI_DB_HOST: ${MUI_DB_HOST:?set MUI_DB_HOST}
      MUI_DB_PORT: ${MUI_DB_PORT:-5432}
      MUI_DB_NAME: ${MUI_DB_NAME:-mui}
      MUI_DB_USER: ${MUI_DB_USER:-mui}
      MUI_DB_PASSWORD: ${MUI_DB_PASSWORD:?set MUI_DB_PASSWORD}
      MUI_DB_SSLMODE: ${MUI_DB_SSLMODE:-require}
      # Secrets: prefer *_FILE (file-injected) over plain env when the server
      # supports it: set e.g. MUI_SECRET_FILE=/run/secrets/mui_secret and
      # REMOVE the corresponding plain MUI_SECRET line below. Never commit
      # real secret values into this file or .env.
      MUI_SECRET: ${MUI_SECRET:?set MUI_SECRET}
      MUI_ADMIN_PASSWORD: ${MUI_ADMIN_PASSWORD:?set MUI_ADMIN_PASSWORD}
      # No MUI_ADMIN_RESET here on purpose: admin reset is a one-time manual
      # operation (see README "忘记密码"), never a persistent env value.
      # Leaving it set would reset the password on every container restart.
      MUI_PUBLIC_URL: ${MUI_PUBLIC_URL:?set MUI_PUBLIC_URL}
      # The frontend is the only public entry point on this network.
      MUI_TRUSTED_PROXIES: ${MUI_TRUSTED_PROXIES:-${MUI_PROXY_SUBNET:-172.30.17.0/24}}
      MUI_RELEASE_PUBLIC_KEY: ${MUI_RELEASE_PUBLIC_KEY:-}
      MUI_TRAFFIC_RETENTION_DAYS: ${MUI_TRAFFIC_RETENTION_DAYS:-90}
      MUI_LISTEN: :8080
    # Allow Linux containers to reach a PostgreSQL instance on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    volumes:
      # Built by deploy/build-agent.sh; the panel serves these files to new servers.
      - ../bin:/app/bin:ro
    networks:
      - default
    healthcheck:
      # The backend image includes bash, so no extra HTTP client is required.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  mui-web:
    container_name: mui-web
    build:
      context: ..
      dockerfile: deploy/Web.Dockerfile
    restart: unless-stopped
    environment:
      MUI_BACKEND_URL: ${MUI_BACKEND_URL:-http://mui-service:8080}
      MUI_DNS_RESOLVER: ${MUI_DNS_RESOLVER:-127.0.0.11}
      MUI_EDGE_PROXY_CIDR: ${MUI_EDGE_PROXY_CIDR:-172.30.17.1/32}
    ports:
      - ${MUI_BIND:-127.0.0.1:8080}:8080
    networks:
      - default
    depends_on:
      mui-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    external: true
    name: docker_default