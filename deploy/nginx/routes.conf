# Included inside the inner HTTP frontend server.
index index.html;
server_tokens off;
client_max_body_size 2m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
# The backend sends these too. Return one copy at the public entry point.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# real_ip accepts client IPs only from the configured outer Nginx. Replace
# the chain with that resolved IP before forwarding it to Go.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $mui_forwarded_proto;
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 30m;
proxy_buffering off;
# Also support a backend on another host using its valid HTTPS certificate.
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}

location = /healthz {
    access_log off;
    proxy_pass $mui_backend$request_uri;
}

location ~ ^/(api|agent|download|s)(/|$) {
    # Subscription tokens are in the path. Do not put them in access logs.
    access_log off;
    proxy_pass $mui_backend$request_uri;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
}

location ~ /\. {
    return 404;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}
