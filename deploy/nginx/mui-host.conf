# Inner frontend Nginx on the host OS. Install as /etc/nginx/conf.d/mui.conf
# and routes.conf as /etc/nginx/mui/routes.conf. Outer Nginx proxies to :8082.
geo $realip_remote_addr $mui_edge_proxy {
    default 0;
    127.0.0.1/32 1;
}
map "$mui_edge_proxy:$http_x_forwarded_proto" $mui_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 127.0.0.1:8082;
    server_name _;
    root /var/www/mui;
    set_real_ip_from 127.0.0.1/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Replace with the backend private address when it runs on another host.
    # A hostname additionally requires a resolver directive for your DNS server.
    set $mui_backend http://127.0.0.1:8080;
    include /etc/nginx/mui/routes.conf;
}
