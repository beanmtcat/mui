# Include INSIDE the existing outer HTTPS server block for the panel domain.
# This snippet does not add listeners or change your existing TLS settings.
location / {
    proxy_pass http://127.0.0.1:8086;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    # This outer Nginx receives public traffic: replace supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 30m;
    proxy_buffering off;
    client_max_body_size 2m;
    # Subscription credentials are in the URL path.
    access_log off;
}
